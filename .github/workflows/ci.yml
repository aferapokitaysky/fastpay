name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation-guard:
    name: Documentation guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required collaboration and product files
        run: |
          test -f README.md
          test -f docs/PRODUCT_SPEC_MVP.md
          test -f docs/IMPLEMENTATION_PLANS.md
          test -f docs/api/FRONTEND_BACKEND_CONTRACT.md
          test -f collaboration/README.md
          test -f collaboration/INBOX.md
          test -f collaboration/DECISIONS.md
      - name: Reject obvious committed secrets
        run: |
          ! rg -n --glob '!docs/**' --glob '!*.example' '(sk-[A-Za-z0-9_-]{20,}|MONOBANK.*TOKEN\s*=\s*[^$]|DATABASE_URL\s*=\s*(postgres|mysql))' .

  api:
    name: api (lint, build, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fastpay
          POSTGRES_PASSWORD: fastpay
          POSTGRES_DB: fastpay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fastpay" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - id: has_api
        run: echo "exists=$(test -f apps/api/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.has_api.outputs.exists == 'true'
        with:
          node-version: 20
          cache: npm
      - name: Install
        if: steps.has_api.outputs.exists == 'true'
        run: npm ci
      - name: Lint
        if: steps.has_api.outputs.exists == 'true'
        run: npm run lint -w apps/api --if-present
      - name: Migrate
        if: steps.has_api.outputs.exists == 'true'
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://fastpay:fastpay@localhost:5432/fastpay_test
        run: npm run db:migrate --if-present
      - name: Build
        if: steps.has_api.outputs.exists == 'true'
        run: npm run build -w apps/api --if-present
      - name: Test
        if: steps.has_api.outputs.exists == 'true'
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://fastpay:fastpay@localhost:5432/fastpay_test
          REDIS_URL: redis://localhost:6379
          # CI-only throwaway key (B2: apps/api/src/utils/crypto.ts) — 32 bytes, base64.
          # Never reused for real credentials; regenerate freely if it ever needs rotating.
          PAYMENT_CREDENTIALS_ENCRYPTION_KEY: "5mc4e5MO4zcozfZJThTc2bApRYhZl0l/MK8e2codcJU="
        run: npm test --if-present
      - name: Skipped (no apps/api yet)
        if: steps.has_api.outputs.exists == 'false'
        run: echo "apps/api/package.json not found yet — skipping"
